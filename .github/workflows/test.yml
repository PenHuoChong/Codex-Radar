name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show environment
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          (Get-Culture).Name
          [Environment]::OSVersion.VersionString
      - name: Build launcher and indexer
        shell: powershell
        run: .\Build.ps1
      - name: Run regression tests
        shell: powershell
        run: .\tests\Run-Tests.ps1
      - name: Verify UI callbacks on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Run-UiCallbackTests.ps1
      - name: Verify UI callbacks on PowerShell 7
        shell: pwsh
        run: .\tests\Run-UiCallbackTests.ps1
      - name: Verify quota dialog on Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File .\tests\Run-QuotaPlanDialogTests.ps1
      - name: Verify quota dialog on PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -STA -File .\tests\Run-QuotaPlanDialogTests.ps1
